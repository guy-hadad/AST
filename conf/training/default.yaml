hf:                                # passed verbatim to transformers.Seq2SeqTrainingArguments
  output_dir: ${hydra:runtime.output_dir}
  run_name: ${experiment_name}_${data.category}_${tokenization.variant}_m${tokenization.m}_rho${tokenization.min_share_prob}
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: ndcg@10   # model selection on validation NDCG@10
  greater_is_better: true
  per_device_train_batch_size: 256
  per_device_eval_batch_size: 256
  num_train_epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0001
  save_total_limit: 1
  bf16: true
  predict_with_generate: true
  generation_num_beams: ${generation.num_beams}
  report_to: none                  # set to wandb to log runs
  seed: ${seed}

schedule:                          # evaluate / checkpoint every N epochs
  eval_every_n_epochs: 10
  save_every_n_epochs: 10
  always_eval_on_last: true
  always_save_on_last: true

early_stopping:                    # patience counts evaluations (= 5 x 10 epochs)
  enabled: true
  patience: 5
  threshold: 0.0
